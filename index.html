<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveChat — Real-Time Messaging</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d14;
      --surface: #13131c;
      --surface2: #1c1c28;
      --surface3: #242432;
      --border: #2a2a3a;
      --text: #e4e4f0;
      --muted: #6464a0;
      --accent: #6366f1;
      --accent-light: rgba(99,102,241,.15);
      --green: #22c55e;
      --online: #4ade80;
      --away: #f59e0b;
      --radius: 12px;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

    /* LEFT: CONTACTS */
    .contacts-panel { width: 280px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .contacts-header { padding: 1.1rem 1.1rem .75rem; border-bottom: 1px solid var(--border); }
    .app-brand { display: flex; align-items: center; gap: .5rem; font-weight: 700; font-size: 1rem; margin-bottom: .75rem; }
    .app-brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--online); box-shadow: 0 0 8px var(--online); }
    .search-wrap { position: relative; }
    .search-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: .45rem .75rem .45rem 2rem; color: var(--text); font-family: inherit; font-size: .82rem; outline: none; transition: border-color .2s; }
    .search-input:focus { border-color: var(--accent); }
    .search-icon { position: absolute; left: .6rem; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .contacts-tabs { display: flex; padding: .6rem .6rem 0; gap: .25rem; }
    .tab { flex: 1; background: none; border: none; border-radius: 8px; padding: .4rem; font-family: inherit; font-size: .78rem; color: var(--muted); cursor: pointer; font-weight: 500; transition: all .2s; }
    .tab.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
    .contacts-list { flex: 1; overflow-y: auto; padding: .4rem; }
    .contact-item { display: flex; align-items: center; gap: .65rem; padding: .6rem .5rem; border-radius: var(--radius); cursor: pointer; transition: background .15s; margin-bottom: .15rem; position: relative; }
    .contact-item:hover { background: var(--surface2); }
    .contact-item.active { background: var(--accent-light); }
    .avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .85rem; flex-shrink: 0; position: relative; }
    .avatar-status { position: absolute; bottom: 0; right: 0; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--surface); }
    .online { background: var(--online); }
    .away { background: var(--away); }
    .offline { background: var(--muted); }
    .contact-info { flex: 1; min-width: 0; }
    .contact-name { font-size: .85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .contact-preview { font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: .1rem; }
    .contact-meta { display: flex; flex-direction: column; align-items: flex-end; gap: .25rem; }
    .contact-time { font-size: .68rem; color: var(--muted); }
    .unread-badge { background: var(--accent); color: white; font-size: .65rem; font-weight: 700; border-radius: 999px; min-width: 17px; height: 17px; display: flex; align-items: center; justify-content: center; padding: 0 4px; }

    /* ROOMS */
    .rooms-section { border-top: 1px solid var(--border); padding: .6rem; }
    .rooms-label { font-size: .68rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; padding: .4rem .4rem .3rem; }
    .room-item { display: flex; align-items: center; gap: .5rem; padding: .45rem .5rem; border-radius: 8px; cursor: pointer; font-size: .82rem; color: var(--muted); transition: all .2s; }
    .room-item:hover { background: var(--surface2); color: var(--text); }
    .room-item.active { color: var(--accent); background: var(--accent-light); }
    .room-icon { font-size: .9rem; }

    /* CHAT AREA */
    .chat-area { flex: 1; display: flex; flex-direction: column; }
    .chat-topbar { display: flex; align-items: center; justify-content: space-between; padding: .9rem 1.25rem; border-bottom: 1px solid var(--border); background: var(--surface); }
    .chat-contact { display: flex; align-items: center; gap: .75rem; }
    .chat-name { font-size: .92rem; font-weight: 700; }
    .chat-status { font-size: .75rem; color: var(--online); display: flex; align-items: center; gap: .3rem; margin-top: .1rem; }
    .chat-status .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--online); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.4 } }
    .chat-actions { display: flex; gap: .5rem; }
    .action-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); transition: all .2s; }
    .action-btn:hover { background: var(--surface3); color: var(--text); }

    /* MESSAGES */
    .messages-area { flex: 1; overflow-y: auto; padding: 1.25rem; display: flex; flex-direction: column; gap: .5rem; }
    .date-sep { text-align: center; font-size: .72rem; color: var(--muted); margin: .5rem 0; display: flex; align-items: center; gap: .75rem; }
    .date-sep::before, .date-sep::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .msg-row { display: flex; align-items: flex-end; gap: .5rem; max-width: 70%; }
    .msg-row.own { align-self: flex-end; flex-direction: row-reverse; }
    .msg-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .7rem; flex-shrink: 0; }
    .bubble { padding: .6rem .85rem; border-radius: 16px; font-size: .87rem; line-height: 1.5; position: relative; max-width: 100%; }
    .bubble.other { background: var(--surface2); border-bottom-left-radius: 4px; color: var(--text); }
    .bubble.own { background: var(--accent); border-bottom-right-radius: 4px; color: white; }
    .bubble .meta { display: flex; align-items: center; justify-content: flex-end; gap: .3rem; margin-top: .3rem; }
    .bubble .time-label { font-size: .68rem; opacity: .65; }
    .check { font-size: .7rem; opacity: .8; }
    .typing-bubble { background: var(--surface2); padding: .5rem .85rem; border-radius: 16px; border-bottom-left-radius: 4px; display: inline-flex; align-items: center; gap: .3rem; }
    .typing-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay: .2s; }
    .typing-dot:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
    .media-msg { background: var(--surface2); border-radius: 12px; padding: .75rem; display: flex; align-items: center; gap: .65rem; font-size: .83rem; }
    .media-icon { font-size: 1.4rem; }
    .media-info .fname { font-weight: 600; font-size: .82rem; }
    .media-info .fsize { font-size: .72rem; color: var(--muted); margin-top: .1rem; }

    /* INPUT */
    .input-area { padding: .85rem 1.25rem; border-top: 1px solid var(--border); background: var(--surface); }
    .input-toolbar { display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; }
    .tool-btn { background: none; border: none; color: var(--muted); font-size: .9rem; cursor: pointer; padding: .2rem .3rem; border-radius: 5px; transition: color .2s; }
    .tool-btn:hover { color: var(--text); }
    .input-row { display: flex; align-items: center; gap: .5rem; }
    .msg-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: .65rem 1rem; color: var(--text); font-family: inherit; font-size: .88rem; outline: none; resize: none; transition: border-color .2s; height: 42px; line-height: 1.4; }
    .msg-input:focus { border-color: var(--accent); }
    .send-btn { background: var(--accent); border: none; border-radius: 10px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .2s; flex-shrink: 0; }
    .send-btn:hover { background: #818cf8; }
    .send-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* INFO PANEL */
    .info-panel { width: 260px; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
    .info-header { padding: 1rem; border-bottom: 1px solid var(--border); }
    .info-header h3 { font-size: .88rem; font-weight: 600; }
    .info-profile { padding: 1.25rem; text-align: center; border-bottom: 1px solid var(--border); }
    .info-avatar { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto .75rem; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.2rem; }
    .info-name { font-weight: 700; font-size: .95rem; }
    .info-role { font-size: .75rem; color: var(--muted); margin-top: .2rem; }
    .info-online { font-size: .75rem; color: var(--online); margin-top: .4rem; display: flex; align-items: center; justify-content: center; gap: .3rem; }
    .info-section { padding: .9rem 1rem; border-bottom: 1px solid var(--border); }
    .info-section-title { font-size: .7rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: .65rem; }
    .info-stat { display: flex; justify-content: space-between; font-size: .8rem; margin-bottom: .4rem; }
    .info-stat-val { font-weight: 600; }
    .media-thumbs { display: grid; grid-template-columns: repeat(3,1fr); gap: .35rem; }
    .media-thumb { aspect-ratio: 1; border-radius: 7px; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; transition: opacity .2s; }
    .media-thumb:hover { opacity: .8; }
    .online-members { display: flex; flex-direction: column; gap: .4rem; }
    .member-row { display: flex; align-items: center; gap: .5rem; font-size: .8rem; }
    .member-avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .65rem; }

    @media (max-width: 900px) { .info-panel { display: none; } }
    @media (max-width: 600px) { .contacts-panel { display: none; } }
  </style>
</head>
<body>

<!-- CONTACTS PANEL -->
<div class="contacts-panel">
  <div class="contacts-header">
    <div class="app-brand"><div class="dot"></div>LiveChat</div>
    <div class="search-wrap">
      <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" placeholder="Search messages..." oninput="searchContacts(this.value)">
    </div>
  </div>
  <div class="contacts-tabs">
    <button class="tab active">Direct</button>
    <button class="tab">Groups</button>
    <button class="tab">Archived</button>
  </div>
  <div class="contacts-list" id="contacts-list"></div>
  <div class="rooms-section">
    <div class="rooms-label">Channels</div>
    <div class="room-item active"><span class="room-icon">#</span>general</div>
    <div class="room-item"><span class="room-icon">#</span>projects</div>
    <div class="room-item"><span class="room-icon">#</span>design</div>
    <div class="room-item"><span class="room-icon">🔒</span>private-team</div>
  </div>
</div>

<!-- CHAT AREA -->
<div class="chat-area">
  <div class="chat-topbar">
    <div class="chat-contact">
      <div class="avatar" id="chat-avatar" style="background:linear-gradient(135deg,#6366f1,#a78bfa)">MG</div>
      <div>
        <div class="chat-name" id="chat-name">Maria Garcia</div>
        <div class="chat-status"><div class="status-dot"></div>Online now</div>
      </div>
    </div>
    <div class="chat-actions">
      <div class="action-btn" title="Call">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2.26h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </div>
      <div class="action-btn" title="Video">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      </div>
      <div class="action-btn" title="Search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
    </div>
  </div>

  <div class="messages-area" id="messages-area"></div>

  <div class="input-area">
    <div class="input-toolbar">
      <button class="tool-btn" title="Attach" onclick="simulateAttach()">📎</button>
      <button class="tool-btn" title="Image" onclick="simulateImage()">🖼️</button>
      <button class="tool-btn" title="Emoji">😀</button>
      <button class="tool-btn" title="GIF">GIF</button>
      <button class="tool-btn" title="Code" onclick="insertCode()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></button>
    </div>
    <div class="input-row">
      <textarea class="msg-input" id="msg-input" placeholder="Write a message..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- INFO PANEL -->
<div class="info-panel">
  <div class="info-header"><h3>Info</h3></div>
  <div class="info-profile">
    <div class="info-avatar" style="background:linear-gradient(135deg,#6366f1,#a78bfa)">MG</div>
    <div class="info-name">Maria Garcia</div>
    <div class="info-role">UI/UX Designer</div>
    <div class="info-online"><span style="width:7px;height:7px;border-radius:50%;background:var(--online);display:inline-block"></span>Online</div>
  </div>
  <div class="info-section">
    <div class="info-section-title">Stats</div>
    <div class="info-stat"><span>Messages sent</span><span class="info-stat-val">247</span></div>
    <div class="info-stat"><span>Files shared</span><span class="info-stat-val">18</span></div>
    <div class="info-stat"><span>On the team since</span><span class="info-stat-val">2024</span></div>
  </div>
  <div class="info-section">
    <div class="info-section-title">Recent Files</div>
    <div class="media-thumbs">
      <div class="media-thumb">🖼️</div><div class="media-thumb">📄</div><div class="media-thumb">🎨</div>
      <div class="media-thumb">📊</div><div class="media-thumb">🖼️</div><div class="media-thumb">📦</div>
    </div>
  </div>
  <div class="info-section">
    <div class="info-section-title">Online Members (4)</div>
    <div class="online-members" id="online-members"></div>
  </div>
</div>

<script>
  const CONTACTS = [
    { id:1, name:'Maria Garcia', init:'MG', color:'linear-gradient(135deg,#6366f1,#a78bfa)', status:'online', preview:'Perfect, reviewing it now', time:'Now', unread:2 },
    { id:2, name:'Carlos Herrera', init:'CH', color:'linear-gradient(135deg,#22c55e,#16a34a)', status:'online', preview:'Can you review the PR?', time:'2m', unread:1 },
    { id:3, name:'Ana Rodriguez', init:'AR', color:'linear-gradient(135deg,#06b6d4,#0284c7)', status:'away', preview:'In a meeting until 3pm', time:'15m', unread:0 },
    { id:4, name:'Luis Morales', init:'LM', color:'linear-gradient(135deg,#f59e0b,#d97706)', status:'online', preview:'Thanks for the feedback', time:'1h', unread:0 },
    { id:5, name:'Sandra Lopez', init:'SL', color:'linear-gradient(135deg,#ec4899,#db2777)', status:'offline', preview:'Got it, I'll apply it tomorrow', time:'3h', unread:0 },
    { id:6, name:'Roberto Diaz', init:'RD', color:'linear-gradient(135deg,#8b5cf6,#7c3aed)', status:'offline', preview:'I checked the deploy', time:'Yesterday', unread:0 },
  ];

  const CONVERSATIONS = {
    1: [
      { type:'date', text:'Today' },
      { type:'other', text:'Good morning! I was reviewing the design you sent me yesterday. Loved the color system.', time:'09:12' },
      { type:'own', text:'Thanks! I tried to follow the brand guidelines we set up.', time:'09:14' },
      { type:'other', text:'Exactly. Can you share the card component assets?', time:'09:15' },
      { type:'own', text:'Sure, sending them right now.', time:'09:16' },
      { type:'media', name:'design-system-v2.fig', size:'4.2 MB', icon:'🎨', time:'09:17', own:true },
      { type:'other', text:'Perfect, reviewing it now 👀', time:'09:17' },
    ]
  };

  let activeContact = 1;
  let isTyping = false;
  let typingTimer;

  function renderContacts() {
    document.getElementById('contacts-list').innerHTML = CONTACTS.map(c => `
      <div class="contact-item ${c.id === activeContact ? 'active' : ''}" onclick="selectContact(${c.id})">
        <div class="avatar" style="background:${c.color}">
          ${c.init}
          <div class="avatar-status ${c.status}"></div>
        </div>
        <div class="contact-info">
          <div class="contact-name">${c.name}</div>
          <div class="contact-preview">${c.preview}</div>
        </div>
        <div class="contact-meta">
          <span class="contact-time">${c.time}</span>
          ${c.unread > 0 ? `<span class="unread-badge">${c.unread}</span>` : ''}
        </div>
      </div>
    `).join('');
  }

  function renderOnlineMembers() {
    const online = CONTACTS.filter(c => c.status !== 'offline').slice(0,4);
    document.getElementById('online-members').innerHTML = online.map(c => `
      <div class="member-row">
        <div class="member-avatar" style="background:${c.color}">${c.init}</div>
        <span>${c.name}</span>
        <div class="avatar-status ${c.status}" style="position:static;border:none;margin-left:auto"></div>
      </div>
    `).join('');
  }

  function renderMessages(contactId) {
    const msgs = CONVERSATIONS[contactId] || [];
    const area = document.getElementById('messages-area');
    const c = CONTACTS.find(x => x.id === contactId);
    area.innerHTML = msgs.map(m => {
      if (m.type === 'date') return `<div class="date-sep">${m.text}</div>`;
      if (m.type === 'media') return `
        <div class="msg-row ${m.own ? 'own' : ''}">
          ${!m.own ? `<div class="msg-avatar" style="background:${c.color}">${c.init}</div>` : ''}
          <div>
            <div class="media-msg ${m.own ? 'bubble own' : ''}">
              <div class="media-icon">${m.icon}</div>
              <div class="media-info">
                <div class="fname">${m.name}</div>
                <div class="fsize">${m.size}</div>
              </div>
            </div>
            <div style="text-align:${m.own?'right':'left'};font-size:.68rem;color:var(--muted);margin-top:.2rem">${m.time}</div>
          </div>
        </div>`;
      return `<div class="msg-row ${m.type === 'own' ? 'own' : ''}">
        ${m.type === 'other' ? `<div class="msg-avatar" style="background:${c.color}">${c.init}</div>` : ''}
        <div class="bubble ${m.type === 'own' ? 'own' : 'other'}">
          ${m.text}
          <div class="meta"><span class="time-label">${m.time}</span>${m.type === 'own' ? '<span class="check">✓✓</span>' : ''}</div>
        </div>
      </div>`;
    }).join('');
    scrollToBottom();
  }

  function selectContact(id) {
    activeContact = id;
    const c = CONTACTS.find(x => x.id === id);
    CONTACTS.find(x => x.id === id).unread = 0;
    document.getElementById('chat-name').textContent = c.name;
    document.getElementById('chat-avatar').style.background = c.color;
    document.getElementById('chat-avatar').textContent = c.init;
    renderContacts();
    if (!CONVERSATIONS[id]) CONVERSATIONS[id] = [{ type:'date', text:'Today' }];
    renderMessages(id);
  }

  function sendMessage() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text) return;
    const time = new Date().toLocaleTimeString('es', { hour:'2-digit', minute:'2-digit' });
    if (!CONVERSATIONS[activeContact]) CONVERSATIONS[activeContact] = [{ type:'date', text:'Today' }];
    CONVERSATIONS[activeContact].push({ type:'own', text, time });
    input.value = '';
    input.style.height = '42px';
    renderMessages(activeContact);
    // Simulate reply
    const c = CONTACTS.find(x => x.id === activeContact);
    if (c.status === 'online') {
      showTyping();
      setTimeout(() => {
        hideTyping();
        const replies = [
          'Got it, noted!',
          'Perfect, thanks for the info.',
          'Can you share more details?',
          'I'''ll review that shortly.',
          'Great! Let'''s keep going with that.',
          'Ok, I'''ll get back to you with more details soon.',
        ];
        const reply = replies[Math.floor(Math.random() * replies.length)];
        const replyTime = new Date().toLocaleTimeString('es', { hour:'2-digit', minute:'2-digit' });
        CONVERSATIONS[activeContact].push({ type:'other', text: reply, time: replyTime });
        c.preview = reply;
        c.time = 'Now';
        renderMessages(activeContact);
        renderContacts();
      }, 1500 + Math.random() * 1000);
    }
  }

  function showTyping() {
    const area = document.getElementById('messages-area');
    const c = CONTACTS.find(x => x.id === activeContact);
    const typing = document.createElement('div');
    typing.className = 'msg-row';
    typing.id = 'typing-indicator';
    typing.innerHTML = `
      <div class="msg-avatar" style="background:${c.color}">${c.init}</div>
      <div class="typing-bubble">
        <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
      </div>`;
    area.appendChild(typing);
    scrollToBottom();
  }

  function hideTyping() {
    const t = document.getElementById('typing-indicator');
    if (t) t.remove();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function autoResize(el) {
    el.style.height = '42px';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function scrollToBottom() {
    const area = document.getElementById('messages-area');
    setTimeout(() => area.scrollTop = area.scrollHeight, 50);
  }

  function simulateAttach() {
    if (!CONVERSATIONS[activeContact]) CONVERSATIONS[activeContact] = [{ type:'date', text:'Today' }];
    const files = [
      { name:'backend-project.zip', size:'2.8 MB', icon:'📦' },
      { name:'wireframes-v3.pdf', size:'1.4 MB', icon:'📄' },
      { name:'database-schema.sql', size:'48 KB', icon:'🗄️' },
    ];
    const f = files[Math.floor(Math.random()*files.length)];
    const time = new Date().toLocaleTimeString('es', { hour:'2-digit', minute:'2-digit' });
    CONVERSATIONS[activeContact].push({ type:'media', ...f, own:true, time });
    renderMessages(activeContact);
  }

  function simulateImage() {
    if (!CONVERSATIONS[activeContact]) CONVERSATIONS[activeContact] = [{ type:'date', text:'Today' }];
    const time = new Date().toLocaleTimeString('es', { hour:'2-digit', minute:'2-digit' });
    CONVERSATIONS[activeContact].push({ type:'media', name:'screenshot-2026.png', size:'890 KB', icon:'🖼️', own:true, time });
    renderMessages(activeContact);
  }

  function insertCode() {
    const input = document.getElementById('msg-input');
    input.value = input.value + '```\n// tu código aquí\n```';
    input.focus();
  }

  function searchContacts(val) {
    document.querySelectorAll('.contact-item').forEach((el, i) => {
      const name = CONTACTS[i].name.toLowerCase();
      el.style.display = name.includes(val.toLowerCase()) ? '' : 'none';
    });
  }

  renderContacts();
  renderOnlineMembers();
  renderMessages(1);
</script>
</body>
</html>
